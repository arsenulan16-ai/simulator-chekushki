
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download game files
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev \
            automake autopoint gettext \
            python3-pip python3-venv

      - name: Install Buildozer
        run: |
          python3 -m venv --system-site-packages ~/buildozer-venv
          ~/buildozer-venv/bin/pip install --upgrade pip
          ~/buildozer-venv/bin/pip install buildozer setuptools cython==0.29.34

      - name: Fix Android SDK paths
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/tools/bin"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -f "$SDKMANAGER"

          ln -sf "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" || true

          test -f "$SDK/build-tools/35.0.0/aidl"
          echo "Android SDK tools installed"

      - name: Build APK
        run: |
          export PATH="$HOME/buildozer-venv/bin:$PATH"

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/cmdline-tools/latest"

          cp -a "$ANDROID_HOME/cmdline-tools/latest/." \
            "$SDK/cmdline-tools/latest/"

          chmod +x "$SDK/cmdline-tools/latest/bin/sdkmanager"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Simulator-Chekushki-APK
          path: bin/*.apk
          if-no-files-found: error
